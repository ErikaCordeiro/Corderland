<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#100A18" />
    <meta name="description" content="{{ description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Coderland" />
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta property="og:image" content="https://corderland.onrender.com/static/images/brand/coderland-logo-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo oficial da Coderland em dourado e roxo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://corderland.onrender.com/static/images/brand/coderland-logo-512.png" />
    <link rel="icon" href="/static/images/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/brand/coderland-logo-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/brand/coderland-logo-180.png" />
    <link rel="canonical" href="{{ canonical }}" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/accessibility.css') }}" />
    <script>window.__CODERLAND_SITE__ = {{ site|tojson }}; window.__PROJECT_SLUG__ = {{ project_slug|tojson }};</script>
    <script defer src="{{ url_for('static', filename='vendor/react.production.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='vendor/react-dom.production.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/app.min.js') }}"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width:800px;margin:60px auto;padding:24px">
        <h1>{{ title }}</h1><p>{{ description }}</p>
        <h2>Soluções</h2><ul>{% for service in site.services %}<li>{{ service }}</li>{% endfor %}</ul>
        <h2>Projetos</h2><p>{% for project in site.projects %}{{ project.name }}{% if not loop.last %} · {% endif %}{% endfor %}</p>
        <p>Ative o JavaScript para explorar a experiência completa ou <a href="{{ site.whatsapp.waMe }}">converse com a Coderland pelo WhatsApp</a>.</p>
      </main>
    </noscript>
  </body>
</html>
